name: SIH 24/7 Uptime Monitor

on:
  schedule:
    # Watchdog cron: triggers every 5 minutes in GitHub's cloud as a safety net
    - cron: '*/5 * * * *'
  workflow_dispatch: # Can be triggered manually from GitHub Web / Phone App

concurrency:
  group: sih-monitor
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  monitor-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run 60-second Continuous Monitor (runs for 30 checks / 30 mins)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC || 'sih_status_alert_psp' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL: "60"
          MAX_ITERATIONS: "30"
        run: |
          python3 check_sih.py

      - name: Chain next run automatically (Infinite 24/7 loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next monitor cycle to keep running 24/7..."
          gh workflow run monitor.yml --ref main || true
